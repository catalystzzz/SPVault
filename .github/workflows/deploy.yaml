name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Configura Python per far girare i tuoi script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm ci

      # 2. Esegue i tuoi script personali per aggiornare gli indici nel vault
      - name: Run Vault Index Scripts
        run: |
          python update_recent.py
          python update_tags.py
          python update_multimedia.py

      # 3. Compila il sito statico con Quartz
      - name: Build Quartz
        run: npx quartz build

      # 4. Esegue lo script di fix dei tag sui file HTML generati
      - name: Fix Tags
        run: python fix_tags.py

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
